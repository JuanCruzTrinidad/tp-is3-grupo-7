services:
  backend:
    build: .
    container_name: whatsapp-analyzer-backend
    ports:
      - "5000:5000"
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    container_name: whatsapp-analyzer-frontend
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    restart: unless-stopped
